<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Government of Jharkhand">
  <rect width="64" height="64" rx="12" fill="#0f3d2e"/>
  <rect x="4" y="4" width="56" height="56" rx="10" fill="none" stroke="#dfe8e5" stroke-width="1.5"/>
  
  <!-- Upper section - Saffron with Jharkhand symbol -->
  <rect x="4" y="4" width="56" height="18.5" fill="#ff9933"/>
  <text x="32" y="20" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff" font-family="Arial">JH</text>
  
  <!-- Middle section - White with emblem -->
  <rect x="4" y="22.5" width="56" height="19" fill="#fff"/>
  
  <!-- Lower section - Green -->
  <rect x="4" y="41.5" width="56" height="18.5" fill="#138808"/>
  
  <!-- Central Ashoka Chakra (modified) -->
  <circle cx="32" cy="32" r="7.2" fill="#000080"/>
  <circle cx="32" cy="32" r="6.15" fill="none" stroke="#138808" stroke-width="0.35"/>
  
  <!-- Jharkhand state representation (waterfall/forest) -->
  <g stroke="#138808" stroke-width="0.8" fill="none" stroke-linecap="round">
    <path d="M 32 26 Q 30 28, 28 30 Q 26 32, 24 34"/>
    <path d="M 32 26 Q 34 28, 36 30 Q 38 32, 40 34"/>
  </g>
  
  <!-- Center dot -->
  <circle cx="32" cy="32" r="1" fill="#138808"/>
</svg>
