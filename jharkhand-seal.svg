<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sealGradient" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#1d9a3d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d6a13;stop-opacity:1" />
    </radialGradient>
    <filter id="sealShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer circle background -->
  <circle cx="100" cy="100" r="95" fill="url(#sealGradient)" filter="url(#sealShadow)"/>
  
  <!-- Border ring -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#138808" stroke-width="2"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="#fff" stroke-width="1" opacity="0.3"/>
  
  <!-- Inner text circle - Jharkhand text -->
  <defs>
    <path id="topCurve" d="M 30,100 A 70,70 0 0,1 170,100" fill="none"/>
    <path id="bottomCurve" d="M 170,100 A 70,70 0 0,1 30,100" fill="none"/>
  </defs>
  
  <!-- Top curve text: झारखंड सरकार -->
  <text font-size="12" fill="#fff" font-weight="bold" letter-spacing="1">
    <textPath href="#topCurve" startOffset="50%" text-anchor="middle">
      झारखंड सरकार
    </textPath>
  </text>
  
  <!-- Center circle with Ashoka Chakra representation -->
  <circle cx="100" cy="100" r="50" fill="#fff" opacity="0.95"/>
  
  <!-- Ashoka Chakra (simplified) -->
  <circle cx="100" cy="100" r="45" fill="none" stroke="#138808" stroke-width="2"/>
  
  <!-- Center dot (chakra center) -->
  <circle cx="100" cy="100" r="8" fill="#138808"/>
  
  <!-- Ashoka Chakra spokes (24 spokes) -->
  <g stroke="#138808" stroke-width="1.5" opacity="0.7">
    <line x1="100" y1="55" x2="100" y2="65"/>
    <line x1="115.6" y1="59.2" x2="119.6" y2="68.5"/>
    <line x1="125.9" y1="74.1" x2="128.4" y2="83.5"/>
    <line x1="132" y1="91.4" x2="132" y2="101"/>
    <line x1="132" y1="108.6" x2="132" y2="118"/>
    <line x1="125.9" y1="125.9" x2="128.4" y2="116.5"/>
    <line x1="115.6" y1="140.8" x2="119.6" y2="131.5"/>
    <line x1="100" y1="145" x2="100" y2="135"/>
    <line x1="84.4" y1="140.8" x2="80.4" y2="131.5"/>
    <line x1="74.1" y1="125.9" x2="71.6" y2="116.5"/>
    <line x1="68" y1="108.6" x2="68" y2="118"/>
    <line x1="68" y1="91.4" x2="68" y2="101"/>
    <line x1="74.1" y1="74.1" x2="71.6" y2="83.5"/>
    <line x1="84.4" y1="59.2" x2="80.4" y2="68.5"/>
  </g>
  
  <!-- Lion Capital symbol representation (simplified) -->
  <g fill="#138808" opacity="0.6">
    <!-- Simple representation of Ashoka emblem -->
    <polygon points="100,75 95,85 105,85"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="42" fill="none" stroke="#138808" stroke-width="1" stroke-dasharray="2,3" opacity="0.5"/>
  
  <!-- Shine effect -->
  <circle cx="100" cy="100" r="45" fill="none" stroke="#fff" stroke-width="1" opacity="0.2"/>
  <circle cx="85" cy="85" r="12" fill="#fff" opacity="0.15" filter="url(#sealShadow)"/>
</svg>